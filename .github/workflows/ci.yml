name: CI

# Build, testes e pack em todo push e PR. Publicação no nuget.org só em tag v* (job "publicar").
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  AUDITORIA: -p:NuGetAudit=true -p:NuGetAuditMode=all -p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Gate NuGetAudit (sem pacote com advisory, direto ou transitivo)
        run: dotnet restore Danfe.NFe.Core.sln ${{ env.AUDITORIA }}

      - name: Sem ImageSharp
        shell: pwsh
        run: |
          $l = dotnet list Danfe.NFe.Core.sln package --include-transitive
          if ($l -match 'SixLabors') { $l; throw 'SixLabors.* encontrado no grafo de dependências.' }

      - name: Build (0 avisos)
        run: dotnet build Danfe.NFe.Core.sln -c Release --no-restore -p:GeneratePackageOnBuild=false -p:TreatWarningsAsErrors=true

      - name: Testes (net8.0 e net10.0)
        run: dotnet test Danfe.NFe.Core.sln -c Release --no-build

      - name: Pack
        run: dotnet pack Danfe.NFe.Core/Danfe.NFe.Core.csproj -c Release --no-build -o artifacts

      - uses: actions/upload-artifact@v7
        with:
          name: pacotes
          path: artifacts/*

  linux-sem-fontes:
    # Imagem do SDK sem nenhuma fonte instalada: prova o fallback para a Liberation Serif embutida.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/dotnet/sdk:10.0
    steps:
      - uses: actions/checkout@v7

      - name: Confirma que não há fontes no sistema
        run: test ! -d /usr/share/fonts && test ! -d /usr/local/share/fonts

      - name: Gate NuGetAudit
        run: dotnet restore Danfe.NFe.Core.sln ${{ env.AUDITORIA }}

      - name: Testes (net10.0)
        run: dotnet test Danfe.NFe.Core.Tests/Danfe.NFe.Core.Tests.csproj -c Release -f net10.0 -p:GeneratePackageOnBuild=false -p:TreatWarningsAsErrors=true

  publicar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux-sem-fontes]
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      id-token: write   # OIDC do Trusted Publishing do nuget.org
      contents: write   # GitHub Release
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pacotes
          path: artifacts

      - name: Versão da tag = versão do pacote
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          test -f "artifacts/NFe.Danfe.PdfSharp.${VERSAO}.nupkg" || { ls artifacts; echo "A tag $GITHUB_REF_NAME não bate com a <Version> do .csproj."; exit 1; }

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: NuGet login (OIDC -> API key temporária)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push para o nuget.org (.nupkg e .snupkg)
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          generate_release_notes: true
